name: "Actualis — audit what your coding agent actually did"
description: >-
  Read the execution log a Claude Code Action run leaves on the runner and
  report exposed credentials, risky shell activity and cost. Local, read-only,
  no network, no account.
author: "Digital Foundry Solutions, LLC"

branding:
  icon: shield
  color: orange

inputs:
  execution-file:
    description: >-
      Path to the Claude Code Action's execution log. Pass the upstream step's
      `execution_file` output. This is a published contract of that action;
      reading it is more reliable than guessing at ~/.claude on the runner,
      because the action drives Claude Code through the SDK.
    required: true

  fail-on:
    description: >-
      Fail the job when any unsuppressed finding is at or above this level:
      `critical`, `high`, or `any`. Set to `none` to report without gating.
      Case does not matter; any other value fails the job as a usage error.
    required: false
    default: "critical"

  network-strict:
    description: >-
      "true" makes every download the agent made without asking, from a source
      not in network-trust or .actualis-network-trust, a medium finding (which
      fail-on: any then fails on).
    required: false
    default: "false"

  network-trust:
    description: >-
      Comma-separated trusted download sources, host or host/path
      (e.g. "npmjs.org,github.com/your-org"). Added to .actualis-network-trust.
    required: false
    default: ""

  ioc:
    description: >-
      Paths to known-bad lists (actualis-ioc lines or OSV). Fetch them in a step
      after the agent step, outside the workspace, e.g. $RUNNER_TEMP. One path
      per line; each is passed as --ioc. Matches are high, so set fail-on: high
      to gate on them.
    required: false
    default: ""

  version:
    description: >-
      Version of actualis to install, e.g. `0.1.12`. Empty installs the latest.
      Pin it: an audit step that silently changes what it flags is worse than
      one that does not run.
    required: false
    default: ""

  json-report:
    description: >-
      Optional path to write the machine-readable report to. Credentials are
      redacted; the value of a secret is never written, only a hash of it.
      Useful as a `--diff` baseline on the next run.
    required: false
    default: ""

  summary:
    description: >-
      Write the report to the GitHub job summary. Redacted, but the summary is
      as visible as the job log, so set to `false` on a public repository if
      command text alone is sensitive.
    required: false
    default: "true"

outputs:
  exit-code:
    description: "0 clean, 3 findings at or above fail-on, 1 could not run, 2 a usage error (a bad network-trust entry, say)."
    value: ${{ steps.audit.outputs.exit-code }}
  findings:
    description: "Coach findings plus unsuppressed credentials, or empty if the scan could not run. It does not count flagged shell commands or IOC hits, which can also fail the gate: branch on gate-reasons for that."
    value: ${{ steps.audit.outputs.findings }}
  gate-reasons:
    description: "Number of reasons the fail-on gate fired on (each a group, e.g. \"2 high-severity shell command(s) flagged\"); 0 when it passed or fail-on is none, empty if the scan could not run."
    value: ${{ steps.audit.outputs.gate-reasons }}
  ioc-matches:
    description: "Number of unsuppressed --ioc matches (not refused), or empty if the scan could not run."
    value: ${{ steps.audit.outputs.ioc-matches }}

runs:
  using: composite
  steps:
    - name: Install actualis
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ]; then
          python3 -m pip install --quiet --disable-pip-version-check "actualis==$VERSION"
        else
          python3 -m pip install --quiet --disable-pip-version-check actualis
        fi
        echo "actualis $(actualis --version | awk '{print $2}') installed"

    - name: Audit the agent session
      id: audit
      shell: bash
      env:
        EXECUTION_FILE: ${{ inputs.execution-file }}
        FAIL_ON: ${{ inputs.fail-on }}
        IOC: ${{ inputs.ioc }}
        JSON_REPORT: ${{ inputs.json-report }}
        NETWORK_STRICT: ${{ inputs.network-strict }}
        NETWORK_TRUST: ${{ inputs.network-trust }}
        SUMMARY: ${{ inputs.summary }}
      run: |
        set -uo pipefail

        if [ -z "${EXECUTION_FILE}" ] || [ ! -f "${EXECUTION_FILE}" ]; then
          echo "::error::execution-file not found: '${EXECUTION_FILE}'"
          echo "Pass the upstream step's execution_file output, e.g."
          # The token is split deliberately. GitHub interpolates expressions
          # (dollar, double brace) anywhere in a run: block -- comments too --
          # BEFORE bash sees it, and a backslash does not escape
          # it -- so writing this expression literally expanded to nothing and
          # left a dangling quote, which killed the whole script with a syntax
          # error in 17ms. Splitting it is the only thing that survives.
          echo "  execution-file: \$""{{ steps.claude.outputs.execution_file }}"
          echo "If Claude Code did not run in this job there is no log to audit."
          exit 1
        fi

        work="${RUNNER_TEMP:-.}"

        # GitHub's expression != is case-insensitive and bash's is not, so
        # "None" used to skip the Gate step and then run as a usage error that
        # only warned. Lowercase once (tr: macOS runners ship bash 3.2, no
        # ${x,,}), and decide here whether the Gate step runs.
        FAIL_ON="$(printf '%s' "${FAIL_ON}" | tr '[:upper:]' '[:lower:]')"
        gate=true
        [ "${FAIL_ON}" = "none" ] && gate=false

        args=(--ci-log "${EXECUTION_FILE}")
        [ "${FAIL_ON}" != "none" ] && args+=(--fail-on "${FAIL_ON}")

        # Under set -u, an empty array expands as an error on bash older than
        # 4.4, so every use below is the guarded form.
        net_args=()
        [ "${NETWORK_STRICT}" = "true" ] && net_args+=(--network-strict)
        [ -n "${NETWORK_TRUST}" ] && net_args+=(--network-trust "${NETWORK_TRUST}")
        # One path per line, so a comma in a path is safe. Both runs get them.
        while IFS= read -r ioc_path; do
          ioc_path="${ioc_path#"${ioc_path%%[![:space:]]*}"}"
          ioc_path="${ioc_path%"${ioc_path##*[![:space:]]}"}"
          [ -n "${ioc_path}" ] && net_args+=(--ioc "${ioc_path}")
        done <<< "${IOC}"
        if [ -n "${IOC//[[:space:]]/}" ] && [ "${FAIL_ON}" = "critical" ]; then
          echo "::warning::IOC matches are high severity; set fail-on: high to gate on them"
        fi
        args+=(${net_args[@]+"${net_args[@]}"})

        # The human-readable report, for the log and the summary. This run
        # carries the gate, so its exit code is the one that matters.
        set +e
        actualis "${args[@]}" > "${work}/report.txt" 2> "${work}/verdict.txt"
        rc=$?
        set -e
        cat "${work}/report.txt"
        cat "${work}/verdict.txt" >&2

        # The machine-readable one, once, without --fail-on: a gating exit
        # code must not truncate a report the user asked to keep. Everything
        # downstream reads this file rather than re-scanning.
        actualis --ci-log "${EXECUTION_FILE}" ${net_args[@]+"${net_args[@]}"} --json > "${work}/report.json" 2>/dev/null || true
        if [ -n "${JSON_REPORT}" ] && [ "${JSON_REPORT}" != "${work}/report.json" ]; then
          cp "${work}/report.json" "${JSON_REPORT}" && echo "wrote ${JSON_REPORT}"
        fi

        # Coach findings plus unsuppressed credentials. Suppressed ones are
        # excluded here for the same reason they do not fail the build: a
        # recorded, reasoned decision should not keep showing up as a number.
        # The path goes in as an argument, never spliced into Python source:
        # on Windows RUNNER_TEMP is D:\a\_temp, and "\a" in a literal is BEL.
        findings=$(python3 - "${work}/report.json" 2>/dev/null <<'PY' || echo ""
        import json, sys
        d = json.load(open(sys.argv[1], encoding='utf-8'))
        print(len(d.get('coach', [])) + len([s for s in d.get('secrets', []) if not s.get('suppressed')]))
        PY
        )
        # Unsuppressed --ioc matches. A separate output: findings keeps its meaning.
        ioc_matches=$(python3 - "${work}/report.json" 2>/dev/null <<'PY' || echo ""
        import json, sys
        d = json.load(open(sys.argv[1], encoding='utf-8'))
        m = d.get('network', {}).get('ioc', {}).get('matches', [])
        print(len([r for r in m if r.get('verdict') == 'match' and not r.get('refused') and not r.get('suppressed')]))
        PY
        )
        # What the gate itself fired on: the "  - reason" lines under the FAIL
        # verdict, from the same function that set the exit code. findings
        # misses flagged commands and IOC hits, which fail the gate too.
        case "${rc}" in
          3) gate_reasons=$(awk '/^actualis: FAIL at --fail-on/ {f=1; next} f && /^  - / {n++} END {print n+0}' "${work}/verdict.txt") ;;
          0) gate_reasons=0 ;;
          *) gate_reasons="" ;;
        esac

        # With fail-on: none there is no Gate step, so a run that could not
        # complete (1) or was refused as a usage error (2) would otherwise be green.
        if [ "${rc}" = "1" ] || [ "${rc}" = "2" ]; then
          echo "::warning::actualis could not complete the audit (exit ${rc})"
        fi

        echo "exit-code=${rc}" >> "$GITHUB_OUTPUT"
        echo "findings=${findings}" >> "$GITHUB_OUTPUT"
        echo "ioc-matches=${ioc_matches}" >> "$GITHUB_OUTPUT"
        echo "gate-reasons=${gate_reasons}" >> "$GITHUB_OUTPUT"
        echo "gate=${gate}" >> "$GITHUB_OUTPUT"

        if [ "${SUMMARY}" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          # The fence is longer than any run of backticks in the report, so
          # transcript text holding ``` cannot close it and render the lines
          # after it as live Markdown (headings, links, image beacons).
          longest=$(awk '{ while (match($0, /`+/)) { if (RLENGTH > m) m = RLENGTH; $0 = substr($0, RSTART + RLENGTH) } } END { print m + 0 }' "${work}/report.txt")
          fence='```'
          while [ "${#fence}" -le "${longest}" ]; do fence="${fence}\`"; done
          {
            echo "## Actualis — what the agent actually did"
            echo
            echo "${fence}"
            cat "${work}/report.txt"
            echo "${fence}"
            echo
            sed 's/^/> /' "${work}/verdict.txt"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        # Deliberately exits 0 even when the gate should fire. A composite
        # action that exits non-zero does not propagate its outputs, so failing
        # here blanked `exit-code` and `findings` exactly when there was
        # something to report. The next step does the failing.
        exit 0

    - name: Gate
      # Decided in the audit step, after lowercasing fail-on there.
      if: ${{ steps.audit.outputs.gate == 'true' }}
      shell: bash
      env:
        RC: ${{ steps.audit.outputs.exit-code }}
        REASONS: ${{ steps.audit.outputs.gate-reasons }}
      run: |
        set -uo pipefail
        if [ "${RC}" = "0" ]; then
          echo "actualis: nothing at or above the threshold."
          exit 0
        fi
        if [ "${RC}" = "3" ]; then
          echo "::error::actualis failed the gate on ${REASONS:-?} reason(s) at or above the threshold (listed in the log above)."
          exit 1
        fi
        # 1 could not run, 2 a usage error. Neither is a clean pass, and
        # neither should be reported as findings.
        echo "::error::actualis could not complete the audit (exit ${RC})."
        exit 1
