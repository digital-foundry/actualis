name: test

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches rot in a repo with no dependencies

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.9+ and cross-platform. Claims get tested.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: no third-party imports
        shell: bash
        run: |
          python -c "
          import ast, sys
          # An explicit allowlist rather than sys.stdlib_module_names, which
          # does not exist before 3.10 and would skip this check on the oldest
          # version it most needs to run on.
          allowed = {'__future__','argparse','collections','contextlib','datetime',
                     'hashlib','importlib','io','json','os','pathlib','re',
                     'subprocess','sys','time','unittest'}
          tree = ast.parse(open('agentfleet.py').read())
          found = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  found |= {a.name.split('.')[0] for a in n.names}
              elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                  found.add(n.module.split('.')[0])
          extra = sorted(found - allowed)
          print('imports:', sorted(found))
          print('outside allowlist:', extra or 'none')
          sys.exit(1 if extra else 0)"
      - run: python -m unittest discover -s tests -v
      - name: runs on an empty machine without crashing
        shell: bash
        run: |
          mkdir -p /tmp/empty
          python agentfleet.py --root /tmp/empty || test $? -eq 1
