name: test

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: a repo with no dependencies still rots
  # A run can wedge in `queued` on GitHub's side and never start. It then holds
  # the concurrency group below, so later pushes create no run at all and the
  # PR simply reports no checks -- with nothing failing and nothing to cancel.
  # This is the escape hatch: `gh workflow run test.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same PR makes the first run pointless. Without this it
# runs to completion anyway, on three operating systems, and macOS bills at 10x
# the Linux rate. Pushes to main are never cancelled: main's history has to
# stay checkable.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The suite takes about 1.5 minutes on a dev Mac (Python 3.9 and 3.15,
    # measured 2026-10-13, ~1475 tests); the hosted runners are 1.2-2.3x slower
    # and Windows spawns subprocesses slowly, so expect 2-4 minutes per job.
    # 10 minutes leaves 2.5x over the slowest; do not tighten it from a fast
    # Linux run. The GitHub default is 360 minutes, so a wedged runner burns
    # six hours per job before anything notices — and a stuck job does not
    # fail, it just sits there holding up the release.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The README claims Python 3.9+ and cross-platform. Claims get tested.
        # Python is installed with uv rather than actions/setup-python, which
        # has no 3.9 build for current runners (macOS is arm64, ubuntu is 24.04).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: version in use
        run: uv run --python ${{ matrix.python }} python -c "import sys; print(sys.version)"

      - name: no third-party imports
        run: |
          uv run --python ${{ matrix.python }} python -c "
          import ast, sys
          # Standard library only. 'typing' is stdlib and carries no runtime
          # cost worth avoiding; it is here because Rate is a NamedTuple.
          # struct and zlib write the --card PNG without an imaging library.
          # base64 and html build the --network --html page (CSP hash, escaping).
          allowed = {'__future__','argparse','base64','collections','contextlib','datetime',
                     'hashlib','html','importlib','io','json','os','pathlib','re',
                     'shutil','struct','subprocess','sys','time','typing',
                     'unittest','zlib'}
          tree = ast.parse(open('actualis.py', encoding='utf-8').read())
          found = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  found |= {a.name.split('.')[0] for a in n.names}
              elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                  found.add(n.module.split('.')[0])
          extra = sorted(found - allowed)
          print('imports:', sorted(found))
          print('outside allowlist:', extra or 'none')
          sys.exit(1 if extra else 0)"

      - name: actualis-reputation imports only the standard library and actualis
        run: |
          uv run --python ${{ matrix.python }} python -c "
          import ast, sys
          # The only module allowed to use the network. Its own list, so the
          # core's list never has to grow.
          allowed = {'__future__','actualis','argparse','base64','datetime','hashlib','json','math',
                     'os','pathlib','secrets','shlex','ssl','subprocess','sys','time','urllib'}
          tree = ast.parse(open('actualis_reputation.py', encoding='utf-8').read())
          found = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  found |= {a.name.split('.')[0] for a in n.names}
              elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                  found.add(n.module.split('.')[0])
          extra = sorted(found - allowed)
          print('imports:', sorted(found))
          print('outside allowlist:', extra or 'none')
          sys.exit(1 if extra else 0)"

      - name: actualis never imports actualis-reputation
        shell: bash
        run: "! grep -nE '^\\s*(import|from)\\s+actualis_reputation' actualis.py"

      - name: tests
        run: uv run --python ${{ matrix.python }} python -m unittest discover -s tests -v

      # Built-in detectors only: the private terms list lives in 1Password and
      # this public repo's runners get no secrets. `make pii-full` runs it
      # locally before a release. The suite runs the gate too
      # (test_this_repository_is_clean); this step shows its findings plainly.
      - name: PII gate
        if: matrix.os == 'ubuntu-latest'
        run: uv run --python ${{ matrix.python }} python tools/pii-gate.py

      - name: exits cleanly with no transcripts
        shell: bash
        run: |
          mkdir -p empty-probe
          uv run --python ${{ matrix.python }} python actualis.py --root empty-probe \
            && echo "unexpected success" && exit 1 || test $? -eq 1
