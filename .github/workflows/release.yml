# Publish to PyPI on a version tag, using Trusted Publishing.
#
# There is no API token here and none in the repository secrets. PyPI verifies
# a short-lived OIDC identity minted by GitHub for this exact workflow, so
# there is no long-lived credential to leak, rotate, or find in a transcript.
# For a tool whose entire pitch is that it has no supply chain and no secrets,
# a PYPI_API_TOKEN sitting in repo settings would be the wrong look and the
# wrong risk.
#
# One-time setup on PyPI (Your projects -> Publishing -> Add a pending publisher):
#   PyPI project name : actualis
#   Owner             : digital-foundry
#   Repository        : actualis
#   Workflow          : release.yml
#   Environment       : pypi
# A "pending" publisher can be created before the project exists; the first
# successful run claims the name.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # so the existing v0.1.0 tag can be published too

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"

      # The tag and the packaged version must agree. They have drifted in every
      # project that did not check, and a mismatched upload cannot be undone:
      # PyPI does not allow re-uploading a filename.
      - name: tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run --no-project python -c \
            "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != pyproject $pkg"; exit 1; }

      - name: tests must pass before anything is published
        run: uv run --no-project python -m unittest discover -s tests -q

      - name: build
        run: uv build

      # Catches malformed metadata before it reaches PyPI, where the filename
      # is then burned forever.
      - name: check metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # must match the pending publisher config
    permissions:
      id-token: write          # OIDC: this is what replaces the API token
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true   # PEP 740 provenance, verifiable against this repo

  # The tray binaries are built by the same reusable workflow CI uses, so what
  # is attached to a release cannot drift from what was tested.
  tray:
    uses: ./.github/workflows/tray-build.yml

  # Without this, a tag published to PyPI and left the GitHub release pointing
  # at the previous version's binaries. That happened twice on 2026-08-24 and
  # was only caught by looking; nothing failed, the release simply never
  # appeared. Automating it is the only way that stays fixed.
  github-release:
    needs: [build, pypi, tray]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No `name:` downloads every artifact, each into its own directory.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts/

      - name: assemble assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name 'actualis-tray-*' -o -name '*.whl' \
            -o -name '*.tar.gz' \) -exec cp {} release/ \;
          cd release
          # Explicit prefix rather than `*`, so the checksum file cannot list
          # itself depending on when the shell creates it.
          shasum -a 256 actualis-* > SHA256SUMS
          ls -l

      # The notes are the changelog section for this exact version. If the
      # section is missing the release fails rather than shipping an empty one.
      - name: release notes from the changelog
        run: |
          set -euo pipefail
          python3 - "${GITHUB_REF_NAME#v}" > notes.md <<'EOF'
          import re, sys
          ver = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(ver)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"::error::CHANGELOG.md has no section for {ver}")
          body = m.group(1).strip()
          if len(body) < 40:
              sys.exit(f"::error::CHANGELOG section for {ver} is empty or a stub")
          print(body)
          EOF
          echo "--- notes preview ---"; head -12 notes.md

      # A release candidate must not be marked latest: anyone landing on the
      # repository would be shown a pre-release as the current version, and
      # `gh release download` with no tag would hand them one.
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          case "$ver" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev[0-9]*)
              echo "$ver is a pre-release"; flags="--prerelease" ;;
            *)
              flags="--latest" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Actualis $ver" \
            --notes-file notes.md \
            $flags \
            release/*
