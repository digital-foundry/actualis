# Publish to PyPI on a version tag, using Trusted Publishing.
#
# There is no API token here and none in the repository secrets. PyPI verifies
# a short-lived OIDC identity minted by GitHub for this exact workflow, so
# there is no long-lived credential to leak, rotate, or find in a transcript.
# For a tool whose entire pitch is that it has no supply chain and no secrets,
# a PYPI_API_TOKEN sitting in repo settings would be the wrong look and the
# wrong risk.
#
# One-time setup on PyPI (Your projects -> Publishing -> Add a pending publisher):
#   PyPI project name : actualis
#   Owner             : digital-foundry
#   Repository        : actualis
#   Workflow          : release.yml
#   Environment       : pypi
# A "pending" publisher can be created before the project exists; the first
# successful run claims the name.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # so the existing v0.1.0 tag can be published too

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"

      # The tag and the packaged version must agree. They have drifted in every
      # project that did not check, and a mismatched upload cannot be undone:
      # PyPI does not allow re-uploading a filename.
      - name: tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run --no-project python -c \
            "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != pyproject $pkg"; exit 1; }

      - name: tests must pass before anything is published
        run: uv run --no-project python -m unittest discover -s tests -q

      - name: build
        run: uv build

      # Catches malformed metadata before it reaches PyPI, where the filename
      # is then burned forever.
      - name: check metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # must match the pending publisher config
    permissions:
      id-token: write          # OIDC: this is what replaces the API token
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true   # PEP 740 provenance, verifiable against this repo
