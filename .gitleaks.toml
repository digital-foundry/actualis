# gitleaks config. The org-required secret scan reads a repo's root
# .gitleaks.toml on every pull request, and `make security` uses it too. The
# default rules, minus files whose whole job is to hold invented credential
# shapes (detector fixtures, the demo fleet, plan docs quoting those
# fixtures). Every value in them is fabricated; a real secret anywhere else
# still fails the scan.
[extend]
useDefault = true

[allowlist]
description = "invented credential fixtures"
paths = [
  '''^tests/''',
  '''^tools/make-demo-fleet\.py$''',
  # Implementation plans quoting those fixtures. They moved out of the tree on
  # 2026-11-01 (#76) but the history still holds them.
  '''^docs/superpowers/plans/''',
  # actualis.py's name before the rename; its history holds the redaction
  # regexes for database URLs with passwords, which detectors read as secrets.
  '''^agentfleet\.py$''',
]
