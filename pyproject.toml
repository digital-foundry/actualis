[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actualis"
version = "0.1.7"
description = "What actually ran. Local, read-only, honest about limits."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Digital Foundry Solutions, LLC" }]
keywords = ["claude", "claude-code", "ai-agents", "cost", "observability", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
# No runtime dependencies, deliberately. This tool reads your session history;
# it should be auditable in one sitting and installable without a supply chain.
dependencies = []

[project.scripts]
actualis = "actualis:main"

[project.urls]
Homepage = "https://actualis.app"
Source = "https://github.com/digital-foundry/actualis"
Issues = "https://github.com/digital-foundry/actualis/issues"

[tool.hatch.build.targets.wheel]
include = ["actualis.py"]

[tool.hatch.build.targets.sdist]
include = ["actualis.py", "README.md", "LICENSE", "tests/"]
