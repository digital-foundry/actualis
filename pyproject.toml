[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actualis"
version = "0.1.7"
description = "What actually ran. Local, read-only, honest about limits."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Digital Foundry Solutions, LLC" }]
keywords = [
  # How people actually search PyPI for this: by the agent they run, by the
  # problem they have, and by the shape of the tool.
  "claude", "claude-code", "codex", "anthropic", "openai",
  "ai-agents", "coding-agent", "agent-security", "llm", "llmops",
  "secrets", "secret-detection", "credentials", "security", "devsecops",
  "cost", "cost-tracking", "finops", "observability", "audit",
  "cli", "terminal", "transcripts",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  # The README claims 3.9+ and cross-platform, and CI tests both ends of that
  # range on three operating systems. Claims that CI proves belong here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
# No runtime dependencies, deliberately. This tool reads your session history;
# it should be auditable in one sitting and installable without a supply chain.
dependencies = []

[project.scripts]
actualis = "actualis:main"

[project.urls]
Homepage = "https://actualis.app"
Source = "https://github.com/digital-foundry/actualis"
Issues = "https://github.com/digital-foundry/actualis/issues"

[tool.hatch.build.targets.wheel]
include = ["actualis.py"]

[tool.hatch.build.targets.sdist]
include = ["actualis.py", "README.md", "LICENSE", "tests/"]
