# gitleaks config for `make security`: the default rules, minus files whose
# whole job is to hold invented credential shapes (detector fixtures, the demo
# fleet, plan docs quoting those fixtures). Every value in them is fabricated;
# a real secret anywhere else still fails the scan.
[extend]
useDefault = true

[allowlist]
description = "invented credential fixtures"
paths = [
  '''^tests/''',
  '''^tools/make-demo-fleet\.py$''',
  '''^docs/superpowers/plans/''',
  # actualis.py's name before the rename; its history holds the redaction
  # regexes for database URLs with passwords, which detectors read as secrets.
  '''^agentfleet\.py$''',
]
